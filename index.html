<!DOCTYPE html>
<html lang="en">
<head>

            ✨ Some people simply deserve to be celebrated. ✨

    </div>

</div>

<div id="balloons"></div>

<div id="confetti"></div>

    <source src="kalank.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
